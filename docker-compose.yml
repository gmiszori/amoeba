# Production stack:   docker compose up --build -d
# Set DOMAIN in .env; Caddy serves it with automatic HTTPS. Host ports 80 and
# 443 belong to the webserver repo's proxy (github.com/gmiszori/webserver),
# which must be running first: it creates the shared "webserver" network.
name: amoeba

# Every container: read-only filesystem, no Linux capabilities, no privilege
# escalation, and memory/process caps so one can't starve the VPS.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  restart: unless-stopped

services:
  server:
    <<: *hardening
    build: ./server
    mem_limit: 256m
    environment:
      TURN_SECONDS: ${TURN_SECONDS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/amoeba-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  web:
    <<: *hardening
    build: ./client
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    # Lets the unprivileged Caddy user bind 80 and 443 without capabilities.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    networks:
      default:
      # Not published on the host: the webserver proxy routes this domain here.
      webserver:
        aliases: [amoeba]
    volumes:
      - caddy_data:/data # TLS certificates; keep across restarts
      - caddy_config:/config
    tmpfs:
      - /tmp
    depends_on:
      server:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  webserver:
    external: true
