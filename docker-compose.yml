# Production stack:   docker compose up --build -d
# Set DOMAIN in .env; Caddy serves it on ports 80 and 443 with automatic HTTPS.
name: amoeba

# Every container: read-only filesystem, no Linux capabilities, no privilege
# escalation, and memory/process caps so one can't starve the VPS.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  restart: unless-stopped

services:
  server:
    <<: *hardening
    build: ./server
    mem_limit: 256m
    environment:
      TURN_SECONDS: ${TURN_SECONDS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/amoeba-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  web:
    <<: *hardening
    build: ./client
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    # Lets the unprivileged Caddy user bind 80 and 443 without capabilities.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    volumes:
      - caddy_data:/data # TLS certificates; keep across restarts
      - caddy_config:/config
    tmpfs:
      - /tmp
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3

volumes:
  caddy_data:
  caddy_config:
