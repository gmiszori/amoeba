<!doctype html>
<!-- Link preview image, 1200×630, in the miszori.dev brand's project layout:
     plain black, the address small at the top, the project name large in
     amoeba's dark-theme orange ink, "by miszori.dev" under it. render.sh
     screenshots this page into public/og-image.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000000;
        font-family: "Instrument Sans", sans-serif;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
      }
      .top,
      .by {
        font-size: 30px;
        color: #a3a3a3;
      }
      .top {
        font-weight: 600;
      }
      .name {
        display: block;
        font-size: 184px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.86;
        color: #ff9a4d;
      }
      .by {
        display: block;
        margin-top: 28px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <span class="top">amoeba.miszori.dev</span>
    <div>
      <span class="name">amőba</span>
      <span class="by">by miszori.dev</span>
    </div>
  </body>
</html>
